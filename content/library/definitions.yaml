# Unfold — definition library
#
# Definitions are leaves of the epistemic tree: they introduce notation and do not
# need justification, but they may depend on earlier definitions.

nodes:
  # ---------------------------------------------------------------- arithmetic
  - id: def:natural-number
    kind: definition
    title: Natural number
    statement: $\mathbb{N} = \{0, 1, 2, 3, \dots\}$ is the set of counting numbers, including $0$.
    body: >-
      Where a proof needs positive integers only, it says so explicitly ($n \ge 1$).
      The structure of $\mathbb{N}$ is given by `ax:peano`.
    prerequisites: [ax:peano]
    tags: [arithmetic]

  - id: def:integer
    kind: definition
    title: Integer
    statement: $\mathbb{Z} = \{\dots, -2, -1, 0, 1, 2, \dots\}$, the natural numbers closed under additive inverses.
    body: >-
      Formally $\mathbb{Z}$ is built from equivalence classes of pairs $(a,b) \in \mathbb{N}^2$
      under $(a,b) \sim (c,d) \iff a + d = b + c$, with $a - b$ denoting the class of $(a,b)$.
      Its algebraic and order structure is `ax:integer-ring`.
    prerequisites: [def:natural-number, ax:integer-ring]
    tags: [arithmetic]

  - id: def:rational-number
    kind: definition
    title: Rational number
    statement: $r \in \mathbb{Q}$ iff $r = a/b$ for some $a \in \mathbb{Z}$ and $b \in \mathbb{Z}$ with $b \ne 0$.
    body: >-
      Formally $\mathbb{Q}$ is the field of fractions of $\mathbb{Z}$: equivalence classes of pairs
      $(a,b)$ with $b \ne 0$ under $(a,b) \sim (c,d) \iff ad = bc$. The expression $a/b$
      is called a *representation* of $r$; a single rational number has infinitely many
      representations.
    prerequisites: [def:integer]
    tags: [arithmetic]

  - id: def:lowest-terms
    kind: definition
    title: Lowest terms
    statement: A representation $a/b$ of a rational number is *in lowest terms* if $\gcd(a,b) = 1$.
    body: >-
      Every nonzero rational number has a representation in lowest terms, and in that
      representation the denominator may be chosen positive. Existence is `lem:lowest-terms-exist`.
    prerequisites: [def:rational-number, def:gcd]
    tags: [arithmetic]

  - id: def:gcd
    kind: definition
    title: Greatest common divisor
    statement: $\gcd(a,b)$ is the largest positive integer dividing both $a$ and $b$; $\gcd(a,b) = 1$ means $a$ and $b$ are *coprime*.
    body: >-
      For $a, b$ not both zero the set of common positive divisors is nonempty (it contains $1$)
      and bounded above by $\max(|a|,|b|)$, so it has a largest element.
    prerequisites: [def:divides, def:integer]
    tags: [arithmetic]

  - id: def:divides
    kind: definition
    title: Divides
    statement: For $a, b \in \mathbb{Z}$, $a \mid b$ ("$a$ divides $b$") means there is $k \in \mathbb{Z}$ with $b = ak$.
    body: >-
      Note $a \mid 0$ for every $a$, and $0 \mid b$ only when $b = 0$. If $a \mid b$ and $b > 0$
      then $|a| \le b$.
    prerequisites: [def:integer]
    tags: [arithmetic]

  - id: def:even
    kind: definition
    title: Even integer
    statement: $n \in \mathbb{Z}$ is *even* if $n = 2k$ for some $k \in \mathbb{Z}$, i.e. $2 \mid n$.
    body: Equivalently, division of $n$ by $2$ leaves remainder $0$.
    prerequisites: [def:divides]
    tags: [arithmetic]

  - id: def:odd
    kind: definition
    title: Odd integer
    statement: $n \in \mathbb{Z}$ is *odd* if $n = 2k + 1$ for some $k \in \mathbb{Z}$.
    body: >-
      The $n$-th positive odd number is $2n - 1$ for $n \ge 1$: substituting $n = 1,2,3,\dots$
      gives $1, 3, 5, \dots$.
    prerequisites: [def:integer]
    tags: [arithmetic]

  - id: def:prime
    kind: definition
    title: Prime number
    statement: $p \in \mathbb{N}$ is *prime* if $p \ge 2$ and the only positive divisors of $p$ are $1$ and $p$.
    body: >-
      An integer $n \ge 2$ that is not prime is *composite*: $n = ab$ with $1 < a, b < n$.
      By convention $1$ is neither prime nor composite. Every prime is $\ge 2$.
    prerequisites: [def:natural-number, def:divides]
    tags: [arithmetic, number-theory]

  - id: def:square-root
    kind: definition
    title: Square root
    statement: For $x \ge 0$, $\sqrt{x}$ is the unique $r \ge 0$ with $r^2 = x$.
    body: >-
      Existence and uniqueness follow from completeness (`ax:real-field`): the set
      $\{y \ge 0 : y^2 \le x\}$ is nonempty and bounded above, so it has a least upper bound
      $r$, and one checks $r^2 = x$; uniqueness holds because $y \mapsto y^2$ is strictly
      increasing on $[0,\infty)$. In particular $\sqrt{2}$ is a well-defined real number
      and $\sqrt{2} > 0$ since $1^2 = 1 < 2$.
    prerequisites: [ax:real-field, def:real-power]
    tags: [analysis]

  - id: def:real-power
    kind: definition
    title: Integer power
    statement: For $r \in \mathbb{R}$ and $n \in \mathbb{N}$, $r^0 = 1$ and $r^{n+1} = r^n \cdot r$.
    body: >-
      Consequences used repeatedly: $r^2 = r \cdot r$, $(ab)^n = a^n b^n$, and
      $(a+b)^2 = a^2 + 2ab + b^2$ (by distributivity).
    prerequisites: [ax:real-field, def:natural-number]
    tags: [algebra]

  - id: def:irrational-number
    kind: definition
    title: Irrational number
    statement: A real number $x$ is *irrational* if $x \notin \mathbb{Q}$, i.e. $x$ is not expressible as $a/b$ with $a \in \mathbb{Z}$, $b \in \mathbb{Z} \setminus \{0\}$.
    body: The irrational numbers are exactly $\mathbb{R} \setminus \mathbb{Q}$.
    prerequisites: [def:rational-number, ax:real-field]
    tags: [number-theory]

  - id: def:square-number
    kind: definition
    title: Square number
    statement: $m$ is a *square* if $m = n^2$ for some $n \in \mathbb{N}$.
    body: The first squares are $0, 1, 4, 9, 16, 25, \dots$
    prerequisites: [def:real-power, def:natural-number]
    tags: [arithmetic]

  - id: def:sum-notation
    kind: definition
    title: Summation notation
    statement: $\sum_{i=1}^{n} a_i = a_1 + a_2 + \cdots + a_n$, defined recursively by $\sum_{i=1}^{0} a_i = 0$ and $\sum_{i=1}^{n+1} a_i = \left(\sum_{i=1}^{n} a_i\right) + a_{n+1}$.
    body: >-
      The recursive clause is exactly what makes the "peel off the last term" move in an
      induction proof legitimate.
    prerequisites: [def:natural-number, ax:integer-ring]
    tags: [arithmetic]

  # ------------------------------------------------------------------ set theory
  - id: def:set
    kind: definition
    title: Set and membership
    statement: A *set* is a collection of objects; $x \in A$ means $x$ is an element of $A$. Sets are determined by their elements.
    body: >-
      Extensionality: $A = B$ iff every element of $A$ is an element of $B$ and conversely.
      Set formation is restricted by `ax:naive-set`.
    prerequisites: [ax:naive-set]
    tags: [set-theory]

  - id: def:subset
    kind: definition
    title: Subset
    statement: $A \subseteq B$ means every element of $A$ is an element of $B$.
    body: >-
      $A \subsetneq B$ means $A \subseteq B$ and $A \ne B$. Note $(0,1) \subseteq \mathbb{R}$.
    prerequisites: [def:set]
    tags: [set-theory]

  - id: def:function
    kind: definition
    title: Function
    statement: >-
      A function $f : A \to B$ assigns to each $x \in A$ exactly one element $f(x) \in B$. $A$ is the *domain*, $B$ the *codomain*, $\{f(x) : x \in A\}$ the *range* or *image*.
    body: >-
      Set-theoretically $f$ is a subset of $A \times B$ such that for each $x \in A$ there is
      exactly one $y$ with $(x,y) \in f$.
    prerequisites: [def:set]
    tags: [set-theory]

  - id: def:injection
    kind: definition
    title: Injection
    statement: >-
      $f : A \to B$ is *injective* (one-to-one) if $f(x) = f(y)$ implies $x = y$.
    body: Distinct inputs give distinct outputs.
    prerequisites: [def:function]
    tags: [set-theory]

  - id: def:surjection
    kind: definition
    title: Surjection
    statement: >-
      $f : A \to B$ is *surjective* (onto) if for every $y \in B$ there is $x \in A$ with $f(x) = y$; equivalently the range of $f$ is all of $B$.
    body: >-
      "No element of the codomain is missed." This is the notion that Cantor's theorem
      denies for $f : \mathbb{N} \to \mathbb{R}$.
    prerequisites: [def:function]
    tags: [set-theory]

  - id: def:bijection
    kind: definition
    title: Bijection
    statement: >-
      $f : A \to B$ is *bijective* if it is both injective and surjective.
    body: A bijection pairs the elements of $A$ with the elements of $B$ exactly once each.
    prerequisites: [def:injection, def:surjection]
    tags: [set-theory]

  - id: def:finite-set
    kind: definition
    title: Finite set
    statement: $A$ is *finite* if $A = \varnothing$ or there is $n \in \mathbb{N}$ and a bijection $A \to \{1, 2, \dots, n\}$; that $n$ is the *cardinality* $|A|$.
    body: >-
      A set that is not finite is *infinite*. Two finite sets are in bijection exactly when
      they have the same cardinality, and no finite set is in bijection with a proper subset
      of itself.
    prerequisites: [def:bijection, def:natural-number]
    tags: [set-theory]

  - id: def:countable
    kind: definition
    title: Countable set
    statement: $A$ is *countable* if there is a surjection $\mathbb{N} \to A$ (equivalently, an injection $A \to \mathbb{N}$); $A$ is *countably infinite* if in addition $A$ is infinite.
    body: >-
      Intuitively: the elements of $A$ can be written out as a (possibly finite) list
      $a_1, a_2, a_3, \dots$ in which every element eventually appears. $\mathbb{N}$, $\mathbb{Z}$
      and $\mathbb{Q}$ are countably infinite.
    prerequisites: [def:surjection, def:finite-set]
    tags: [set-theory, infinity]

  - id: def:uncountable
    kind: definition
    title: Uncountable set
    statement: >-
      $A$ is *uncountable* if $A$ is not countable: there is no surjection $\mathbb{N} \to A$.
    body: >-
      Equivalently, no list $a_1, a_2, a_3, \dots$ of elements of $A$ contains every element
      of $A$. This is exactly what a diagonal argument produces.
    prerequisites: [def:countable]
    tags: [set-theory, infinity]

  - id: def:decimal-expansion
    kind: definition
    title: Decimal expansion
    statement: A decimal expansion $0.d_1 d_2 d_3 \dots$ with digits $d_j \in \{0,\dots,9\}$ denotes the real number $\sum_{j=1}^{\infty} d_j 10^{-j}$.
    body: >-
      The partial sums are increasing and bounded above by $1$, so completeness
      (`ax:real-field`) gives a limit in $[0,1]$. Every $x \in [0,1]$ has at least one such
      expansion; some have exactly two (see `lem:decimal-unique-representation`).
    prerequisites: [ax:real-field, def:real-number-line]
    tags: [analysis, infinity]

  - id: def:real-number-line
    kind: definition
    title: The real line and its intervals
    statement: >-
      $\mathbb{R}$ is the complete ordered field of `ax:real-field`; $(a,b) = \{x \in \mathbb{R} : a < x < b\}$.
    body: >-
      In particular $(0,1)$ is the open unit interval: all reals strictly between $0$ and $1$.
      Every element of $(0,1)$ has a decimal expansion beginning $0.$.
    prerequisites: [ax:real-field]
    tags: [analysis]

  - id: def:equinumerous
    kind: definition
    title: Equinumerous sets
    statement: $A$ and $B$ are *equinumerous*, written $|A| = |B|$, if there is a bijection $A \to B$.
    body: This is an equivalence relation; it is the precise sense of "same number of elements", finite or infinite.
    prerequisites: [def:bijection]
    tags: [set-theory, infinity]

  # -------------------------------------------------------------------- geometry
  - id: def:triangle
    kind: definition
    title: Triangle
    statement: A *triangle* is the figure determined by three non-collinear points $A,B,C$ together with the segments $AB$, $BC$, $CA$.
    body: Its interior angles are $\angle ABC$, $\angle BCA$, $\angle CAB$; its area is the area of the region it bounds.
    prerequisites: [ax:euclidean-plane]
    tags: [geometry]

  - id: def:right-triangle
    kind: definition
    title: Right triangle
    statement: A triangle is *right* if one of its interior angles is a right angle ($90^\circ$). The side opposite the right angle is the *hypotenuse*; the other two are the *legs*.
    body: >-
      In the Pythagorean setting the legs have lengths $a$ and $b$ and the hypotenuse has
      length $c$. The two non-right angles are *acute* (each $< 90^\circ$).
    prerequisites: [def:triangle, def:right-angle]
    tags: [geometry]

  - id: def:right-angle
    kind: definition
    title: Right angle
    statement: A *right angle* is an angle of $90^\circ$; two lines meeting in a right angle are *perpendicular*.
    body: All right angles are congruent to one another, and a straight angle measures $180^\circ$ (two right angles).
    prerequisites: [ax:euclidean-plane]
    tags: [geometry]

  - id: def:square
    kind: definition
    title: Square
    statement: A *square* is a quadrilateral with four congruent sides and four right angles. A square of side $s$ has area $s^2$.
    body: >-
      A quadrilateral with four congruent sides is a rhombus; a rhombus with one right angle
      (hence, by `lem:quadrilateral-angles`, four) is a square. This is the criterion used in
      the rearrangement proof of Pythagoras.
    prerequisites: [def:right-angle, ax:area, def:polygon]
    tags: [geometry]

  - id: def:polygon
    kind: definition
    title: Polygon and quadrilateral
    statement: A *polygon* is a closed plane figure bounded by finitely many straight segments; a *quadrilateral* is a polygon with four sides.
    body: A *rectangle* is a quadrilateral with four right angles; its area is the product of two adjacent side lengths.
    prerequisites: [ax:euclidean-plane]
    tags: [geometry]

  - id: def:congruent
    kind: definition
    title: Congruence
    statement: Two figures are *congruent* if a rigid motion of the plane carries one onto the other; equivalently all corresponding side lengths and angles are equal.
    body: >-
      Congruence criteria include SSS and SAS (`ax:euclidean-plane`). Congruent figures have
      equal area (`ax:area`).
    prerequisites: [ax:euclidean-plane, ax:area]
    tags: [geometry]

  - id: def:graph
    kind: definition
    title: Graph
    statement: A *graph* $G = (V,E)$ is a finite set $V$ of *vertices* and a set $E$ of *edges*, each edge joining two distinct vertices.
    body: >-
      In this library graphs are finite and simple (no loops, no repeated edges). The *degree*
      of a vertex is the number of edges incident with it.
    prerequisites: [def:set, def:finite-set]
    tags: [graph-theory]

  - id: def:planar-graph
    kind: definition
    title: Plane graph and face
    statement: A *plane graph* is a graph drawn in the plane with vertices as points and edges as non-crossing curves. Its complement has finitely many connected components; the bounded ones together with the unbounded one are the *faces*.
    body: >-
      There is always exactly one unbounded ("outer") face, and it is counted in $F$. Each
      edge lies on the boundary of two faces, except that a bridge lies twice on the boundary
      of one face.
    prerequisites: [def:graph]
    tags: [graph-theory, geometry]

  - id: def:connected-graph
    kind: definition
    title: Connected graph
    statement: A graph is *connected* if some (equivalently every) pair of vertices is joined by a path of edges.
    body: Connectivity is what makes $V - E + F$ constant; for a graph with $k$ components the value is $1 + k$.
    prerequisites: [def:graph]
    tags: [graph-theory]

  - id: def:tree
    kind: definition
    title: Tree
    statement: A *tree* is a connected graph with no cycles. A *leaf* is a vertex of degree $1$.
    body: >-
      A tree with $n$ vertices has exactly $n - 1$ edges, and every tree with at least two
      vertices has a leaf (`lem:tree-has-leaf`).
    prerequisites: [def:connected-graph]
    tags: [graph-theory]

  - id: def:polyhedron
    kind: definition
    title: Convex polyhedron
    statement: A *convex polyhedron* is a bounded solid in $\mathbb{R}^3$ whose boundary is a finite union of planar polygonal *faces*, meeting in straight *edges* and *vertices*, such that the segment joining any two of its points lies inside it.
    body: >-
      Convexity is essential: it is what lets us project the surface minus one face flat into
      the plane without crossings (`lem:polyhedron-flattens`). Examples: the cube
      ($V=8, E=12, F=6$), tetrahedron ($4,6,4$), dodecahedron ($20,30,12$).
    prerequisites: [def:polygon, ax:euclidean-plane]
    tags: [geometry, graph-theory]

  - id: def:euler-characteristic
    kind: definition
    title: Euler characteristic
    statement: For a polyhedron or plane graph, $\chi = V - E + F$, where $V, E, F$ count vertices, edges and faces.
    body: >-
      $\chi$ is a topological invariant: it depends only on the surface, not on the particular
      graph drawn on it. For any convex polyhedron the surface is a sphere and $\chi = 2$;
      for a torus $\chi = 0$.
    prerequisites: [def:polyhedron, def:planar-graph]
    tags: [geometry, topology]

  # ----------------------------------------------------------------- computation
  - id: def:turing-machine
    kind: definition
    title: Turing machine
    statement: >-
      A *Turing machine* is a finite tuple $M = (Q, \Sigma, \delta, q_0, q_{halt})$: a finite set of states, a finite tape alphabet, a transition function, a start state, and a halting state, operating on an unbounded tape.
    body: >-
      At each step the machine reads the symbol under its head, consults $\delta$, writes a
      symbol, moves the head one cell left or right, and changes state. A run either reaches
      $q_{halt}$ after finitely many steps (*halts*) or continues forever (*loops*). Because
      $M$ is a finite object described by finitely many symbols, it can be written down as a
      finite string (`lem:strings-countable`).
    prerequisites: [def:finite-set, ax:church-turing]
    tags: [computation]

  - id: def:computable-function
    kind: definition
    title: Computable function
    statement: $f$ is *computable* if some Turing machine, started on any input $x$ in the domain of $f$, halts with $f(x)$ written on its tape.
    body: >-
      Computable functions are closed under composition, and under using one machine as a
      subroutine with a fixed input (`rule:composition`). A machine may be fed the
      description of another machine as its input, because descriptions are strings.
    prerequisites: [def:turing-machine]
    tags: [computation]

  - id: def:decision-problem
    kind: definition
    title: Decision problem and decidability
    statement: >-
      A *decision problem* is a function $P : \Sigma^* \to \{\text{yes}, \text{no}\}$. It is *decidable* if some Turing machine halts on every input and outputs the correct answer.
    body: >-
      A problem is *undecidable* if no Turing machine decides it. Note the requirement of
      halting on **every** input: a machine that gives right answers but sometimes runs
      forever does not decide the problem (that is *semi-decidability*).
    prerequisites: [def:turing-machine, def:computable-function]
    tags: [computation]

  - id: def:halting-problem
    kind: definition
    title: The halting problem
    statement: >-
      $\mathrm{HALT} = \{\langle M, x \rangle : \text{the Turing machine } M \text{ halts on input } x\}$.
    body: >-
      $\langle M, x\rangle$ denotes a fixed effective pairing of the description of $M$ with
      the string $x$ into a single string. The halting problem is *semi-decidable*: simulate
      $M$ on $x$ and answer "yes" if it ever halts — but this procedure never answers "no".
    prerequisites: [def:turing-machine, def:decision-problem, lem:strings-countable]
    tags: [computation]

  - id: def:program-encoding
    kind: definition
    title: Program encoding
    statement: An *encoding* $\langle M \rangle$ is a finite string over a fixed alphabet that fully specifies the Turing machine $M$.
    body: >-
      Encodings are effective: there is a computable function that, given $\langle M \rangle$
      and a string $x$, simulates $M$ on $x$ (the universal Turing machine). Since encodings
      are strings, a program can be given its own encoding as input — the move that powers
      the diagonal argument.
    prerequisites: [def:turing-machine, lem:strings-countable]
    tags: [computation]

  - id: def:proof
    kind: definition
    title: Proof
    statement: A *proof* of $P$ from assumptions $\Gamma$ is a finite sequence of statements, each an element of $\Gamma$, an axiom, or a consequence of earlier statements by a licensed rule, ending with $P$.
    body: >-
      This is the notion of correctness the Unfold validator checks structurally: every
      step must cite an earlier step, a stated definition, a stated axiom, or a named rule.
    prerequisites: [ax:first-order-logic]
    tags: [logic, foundations]
